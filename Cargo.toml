[package]
name = "airlock-scan"
version = "0.1.2"
edition = "2024"
description = "Check a repository for malicious code before it reaches your machine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stedyyulius/Airlock"
readme = "README.md"
keywords = ["security", "malware", "scanner", "supply-chain", "cli"]
categories = ["command-line-utilities"]
include = ["src/**/*", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE-*"]

# The name `airlock` is taken on crates.io, but the command is still `airlock`.
[[bin]]
name = "airlock"
path = "src/main.rs"

[dependencies]
flate2 = "1.1.11"
regex = { version = "1.13.1", default-features = false, features = ["std", "perf"] }
serde_json = "1.0.154"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

# Hostile input should fail loudly, not wrap around silently.
[profile.release]
overflow-checks = true

[target."cfg(windows)".dependencies]
enable-ansi-support = "0.3.1"
