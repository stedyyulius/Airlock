[package]
name = "airlock"
version = "0.1.0"
edition = "2024"
description = "Check a repository for malicious code before it reaches your machine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stedyyulius/Airlock"

[dependencies]
flate2 = "1.1.11"
regex = { version = "1.13.1", default-features = false, features = ["std", "perf"] }
tar = "0.4.46"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

# Hostile input should fail loudly, not wrap around silently.
[profile.release]
overflow-checks = true
